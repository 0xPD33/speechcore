name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            glslc \
            libasound2-dev \
            libopenblas-dev \
            libvulkan-dev \
            pkg-config \
            portaudio19-dev

      - name: Configure OpenBLAS headers
        # whisper-rs-sys (openblas feature) requires this to be set explicitly.
        run: echo "BLAS_INCLUDE_DIRS=$(dirname "$(dpkg -L libopenblas-dev | grep -m1 '/cblas.h$')")" >> "$GITHUB_ENV"

      - name: Install ONNX Runtime (system)
        # Use a system onnxruntime so ort links it dynamically. The default
        # downloaded static build bundles protobuf, which collides with
        # CTranslate2's protobuf at link time (duplicate symbols).
        run: |
          ORT_VERSION=1.22.0
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/ort.tgz" "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar -xzf "$tmp/ort.tgz" -C "$tmp"
          sudo cp -r "$tmp/onnxruntime-linux-x64-${ORT_VERSION}/lib/." /usr/local/lib/
          sudo cp -r "$tmp/onnxruntime-linux-x64-${ORT_VERSION}/include/." /usr/local/include/
          sudo ldconfig
          {
            echo "ORT_STRATEGY=system"
            echo "ORT_LIB_LOCATION=/usr/local/lib"
            echo "OPENBLAS_PATH=/usr"
            echo "LIBRARY_PATH=/usr/local/lib"
            echo "LD_LIBRARY_PATH=/usr/local/lib"
          } >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check minimal API
        run: cargo check

      - name: Lint minimal API
        run: cargo clippy --all-targets -- -D warnings

      - name: Test minimal API
        run: cargo test --no-default-features

      - name: Check runtime API without backends
        run: cargo check --no-default-features --features runtime

      - name: Lint runtime API without backends
        run: cargo clippy --no-default-features --features runtime --all-targets -- -D warnings

      - name: Check runtime API with all backends
        run: cargo check --no-default-features --features runtime,all-backends

      - name: Test CTranslate2 runtime path
        run: cargo test --no-default-features --features runtime,backend-ctranslate2

      - name: Check examples
        run: cargo check --no-default-features --features runtime,backend-whisper-cpp --examples

      - name: Check optional Whisper.cpp backend
        run: cargo check --no-default-features --features backend-whisper-cpp

      - name: Check Whisper.cpp acceleration features
        run: cargo check --no-default-features --features runtime,whisper-cpp-vulkan,whisper-cpp-openblas

      - name: Build documentation
        run: cargo doc --no-deps

      - name: Verify package
        run: cargo package
